name = "my-private-gateway"
main = "cloudflare-worker.ts"
compatibility_date = "2024-01-01"

# Service binding to your private Cloudflare Pages project
[[services]]
binding = "PAGES"
service = "YOUR_PAGES_PROJECT_NAME" # Change to your Cloudflare Pages project name

# Environment variables
[vars]
RENDER_BACKEND_URL = "https://YOUR_BACKEND.onrender.com"
# ACCESS_KEY = "your-secret-passphrase" # Uncomment to require secret access key
